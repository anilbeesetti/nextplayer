name: Build & Sign Release APK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag e.g. v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p $RUNNER_TEMP/signing
          echo "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/signing/release.keystore
          test -s $RUNNER_TEMP/signing/release.keystore

      - name: Build unsigned Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --stacktrace -x lint

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          APK=$(find app/build/outputs/apk -name "*-release-unsigned.apk" | head -n1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk -name "*-release.apk" | head -n1); fi
          echo "Signing $APK"
          $BUILD_TOOLS/zipalign -v -p 4 $APK app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks $RUNNER_TEMP/signing/release.keystore --ks-pass pass:$KEYSTORE_PASSWORD --ks-key-alias $KEY_ALIAS --key-pass pass:$KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out app/build/outputs/apk/release/Graviton-${{ github.ref_name }}.apk app-aligned.apk
          $BUILD_TOOLS/apksigner verify --verbose app/build/outputs/apk/release/Graviton-${{ github.ref_name }}.apk
          sha256sum app/build/outputs/apk/release/*.apk > app/build/outputs/apk/release/checksum.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.release_tag }}
          files: app/build/outputs/apk/release/*
          generate_release_notes: true

      - if: always()
        run: rm -rf $RUNNER_TEMP/signing app-aligned.apk
