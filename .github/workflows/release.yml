name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Unsigned Release APK
        run: ./gradlew assembleRelease

      - name: Sign APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # 1. Reconstruct keystore from GitHub secret
          echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > release.jks
          KEYSTORE_PATH="release.jks"

          # Validate keystore
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "Error: Keystore file is empty or missing after decoding."
            exit 1
          fi
          echo "Keystore successfully decoded. Size: $(stat -c%s "$KEYSTORE_PATH") bytes."

          # 2. Find the latest Android build tools directory dynamically
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          mkdir -p app/build/outputs/apk/signed

          # 3. Align and Sign all APK files generated
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              base=$(basename "$apk" .apk)
              
              # Align APK
              $BUILD_TOOLS/zipalign -v -p 4 "$apk" "app/build/outputs/apk/signed/${base}-aligned.apk"
              
              # Sign APK
              $BUILD_TOOLS/apksigner sign --ks "$KEYSTORE_PATH" \
                --ks-key-alias "$SIGNING_KEY_ALIAS" \
                --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
                --key-pass "pass:$SIGNING_KEY_PASSWORD" \
                --out "app/build/outputs/apk/signed/${base}-signed.apk" \
                "app/build/outputs/apk/signed/${base}-aligned.apk"
                
              # Remove intermediate aligned file
              rm "app/build/outputs/apk/signed/${base}-aligned.apk"
            fi
          done

          # Cleanup keystore
          rm -f "$KEYSTORE_PATH"

      - name: Publish Signed APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Signed Release #${{ github.run_number }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/signed/*-signed.apk
