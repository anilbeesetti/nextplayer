name: CI/CD Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Sign APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build Release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and Sign APKs
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          # Decode keystore
          echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > release.jks
          KEYSTORE_PATH="release.jks"

          # Validate keystore
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "Error: Keystore file is empty or missing after decoding."
            exit 1
          fi
          echo "Keystore successfully decoded. Size: $(stat -c%s "$KEYSTORE_PATH") bytes."

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          mkdir -p app/build/outputs/apk/signed

          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              base=$(basename "$apk" .apk)
              
              # Align
              $BUILD_TOOLS/zipalign -v -p 4 "$apk" "app/build/outputs/apk/signed/${base}-aligned.apk"
              
              # Sign
              $BUILD_TOOLS/apksigner sign \
                --ks "$KEYSTORE_PATH" \
                --ks-key-alias "$SIGNING_KEY_ALIAS" \
                --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
                --key-pass "pass:$SIGNING_KEY_PASSWORD" \
                --out "app/build/outputs/apk/signed/${base}-signed.apk" \
                "app/build/outputs/apk/signed/${base}-aligned.apk"
              
              # Cleanup
              rm -f "app/build/outputs/apk/signed/${base}-aligned.apk"
            fi
          done

          # Cleanup keystore
          rm -f "$KEYSTORE_PATH"

      - name: Upload Signed APKs
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/*.apk
          retention-days: 14

      - name: Upload Unsigned APKs (Fallback)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apks-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
