name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows running manually from the Actions tab

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Permission required to create releases and upload assets
permissions:
  contents: write

jobs:
  build:
    name: Build APK and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Create Pre-Release with Direct APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Debug Build #${{ github.run_number }}
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
