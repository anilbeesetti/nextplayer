name: Graviton - Build Signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Clean previous builds
        run: ./gradlew clean

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Find release APK
        id: find_apk
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find app/build/outputs -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            ! -name "*signed*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not found."
            exit 1
          fi

          echo "Unsigned input APK:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/graviton.keystore"

          test -s "$RUNNER_TEMP/graviton.keystore"

          echo "Keystore successfully decoded."

      - name: Verify keystore
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore "$RUNNER_TEMP/graviton.keystore" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Zipalign APK
        id: align
        env:
          INPUT_APK: ${{ steps.find_apk.outputs.apk }}
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" \
            -f \
            -v \
            4 \
            "$INPUT_APK" \
            "$RUNNER_TEMP/graviton-aligned.apk"

          echo "Zipalign completed."

      - name: Sign APK with apksigner
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/graviton.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$RUNNER_TEMP/Graviton-signed.apk" \
            "$RUNNER_TEMP/graviton-aligned.apk"

          echo "APK signing completed."

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "===== SIGNATURE VERIFICATION ====="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$RUNNER_TEMP/Graviton-signed.apk"

          echo "=================================="
          echo "SUCCESS: APK IS PROPERLY SIGNED."

      - name: Check final APK
        shell: bash
        run: |
          set -e

          test -f "$RUNNER_TEMP/Graviton-signed.apk"

          mkdir -p release

          cp "$RUNNER_TEMP/Graviton-signed.apk" \
            "release/Graviton-signed.apk"

          echo "Final APK:"
          ls -lh release/Graviton-signed.apk

      - name: Upload ONLY verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Graviton-SIGNED-APK
          path: release/Graviton-signed.apk
          if-no-files-found: error
          retention-days: 30
