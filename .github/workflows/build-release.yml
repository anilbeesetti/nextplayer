name: Graviton Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign Graviton APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Locate Release APK
        id: apk
        shell: bash
        run: |
          set -e

          echo "Release directory contents:"
          find app/build/outputs/apk/release -maxdepth 1 -type f -print

          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "Found APK: $APK"
          echo "input=$APK" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty or missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/graviton-release.keystore"

          if [ ! -s "$RUNNER_TEMP/graviton-release.keystore" ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "Keystore decoded successfully."

      - name: Verify signing key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore "$RUNNER_TEMP/graviton-release.keystore" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Signing keystore and alias verified."

      - name: Zipalign APK
        shell: bash
        env:
          INPUT_APK: ${{ steps.apk.outputs.input }}
        run: |
          set -e

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          ALIGNED_APK="$RUNNER_TEMP/graviton-release-aligned.apk"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found at $ZIPALIGN"
            exit 1
          fi

          "$ZIPALIGN" -f -p 4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          echo "APK zipaligned successfully."

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ALIGNED_APK="$RUNNER_TEMP/graviton-release-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/Graviton-release-signed.apk"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found at $APKSIGNER"
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/graviton-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "APK signed successfully."

      - name: Verify signed APK
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$RUNNER_TEMP/Graviton-release-signed.apk"

          echo "APK signature verification successful."

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "$RUNNER_TEMP/Graviton-release-signed.apk" \
            "release/Graviton-release-signed.apk"

          ls -lh release/Graviton-release-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Graviton-release-signed
          path: release/Graviton-release-signed.apk
          if-no-files-found: error
