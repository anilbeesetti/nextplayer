name: Build Unsigned APK

on:
  # Allows you to run it manually from the Actions tab
  workflow_dispatch: 
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        # This builds the APK without trying to sign it
        run: ./gradlew assembleRelease 

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-Release-APK
          # Uploads the generated unsigned APK
          path: app/build/outputs/apk/release/*-unsigned.apk 
          
